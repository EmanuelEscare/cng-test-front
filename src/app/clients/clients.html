<div>
    <p-button (click)="goToClients()" label="Usuarios" />
    <p-button (click)="goToCountry()" label="Paises" />
</div>

<div class="card">
    <p-table [value]="clients" [tableStyle]="{ 'min-width': '50rem' }">
        <ng-template #header>
            <tr>
                <th>Id</th>
                <th>Name</th>
                <th>Phone</th>
                <th>Email</th>
            </tr>
        </ng-template>
        <ng-template #body let-client>
            <tr>
                <td>{{ client.id }}</td>
                <td>{{ client.name }}</td>
                <td>{{ client.phone }}</td>
                <td>{{ client.email }}</td>
            </tr>
        </ng-template>
    </p-table>
</div>
